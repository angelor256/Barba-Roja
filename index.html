<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Barba Roja · Barbería en Rohrmoser</title>
    <meta name="description" content="Barbería Barba Roja, Rohrmoser, San José. Reserva tu cita de barba y pelo en línea." />
    <meta name="theme-color" content="#E51E25" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Barba Roja" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* ---------- Splash / loading screen ---------- */
      html, body { margin: 0; background: #0D0D0D; }
      #splash {
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        background: radial-gradient(circle at 50% 38%, #4a0a0d 0%, #1a0607 38%, #0D0D0D 72%);
        transition: opacity .55s ease, transform .55s ease, visibility .55s;
        padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
      }
      #splash.splash-hide { opacity: 0; visibility: hidden; transform: scale(1.06); }
      #splash .logo-wrap { position: relative; width: 150px; height: 150px; display: grid; place-items: center; }
      #splash .logo-wrap img { width: 112px; height: 112px; border-radius: 50%; position: relative; z-index: 2;
        box-shadow: 5px 5px 0 #E51E25; animation: sp-pop .9s cubic-bezier(.2,1.4,.4,1) both, sp-float 2.4s ease-in-out .9s infinite; }
      #splash .ring { position: absolute; inset: 0; border-radius: 50%; border: 3px dashed #E51E25; animation: sp-spin 6s linear infinite; opacity: .9; }
      #splash .pulse { position: absolute; inset: 8px; border-radius: 50%; border: 2px solid #E51E25; animation: sp-pulse 1.8s ease-out infinite; }
      #splash .pulse.p2 { animation-delay: .9s; }
      #splash h1 { margin: 0; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 44px; letter-spacing: .04em; text-transform: uppercase;
        color: #fff; text-shadow: 3px 3px 0 #E51E25; animation: sp-rise .7s .25s ease-out both; }
      /* Barra tipo poste de barbería */
      #splash .pole { width: min(240px, 68vw); height: 16px; border-radius: 999px; border: 2px solid #fff; overflow: hidden; background: #fff; position: relative;
        box-shadow: 3px 3px 0 #E51E25; animation: sp-rise .7s .4s ease-out both; }
      #splash .pole::before { content: ""; position: absolute; inset: 0;
        background: repeating-linear-gradient(-45deg, #E51E25 0 12px, #fff 12px 24px);
        background-size: 33.94px 100%; animation: sp-stripes .7s linear infinite; }
      #splash p { margin: 0; font: 600 13px Inter, system-ui, sans-serif; letter-spacing: .22em; text-transform: uppercase; color: #a3a3a3;
        animation: sp-rise .7s .55s ease-out both; }
      #splash p::after { content: ""; animation: sp-dots 1.4s steps(4, end) infinite; }
      @keyframes sp-pop { 0% { transform: scale(.2) rotate(-25deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
      @keyframes sp-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes sp-spin { to { transform: rotate(360deg); } }
      @keyframes sp-pulse { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(1.55); opacity: 0; } }
      @keyframes sp-rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes sp-stripes { to { background-position: 33.94px 0; } }
      @keyframes sp-dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75%, 100% { content: "..."; } }
      @media (prefers-reduced-motion: reduce) { #splash *, #splash *::before { animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite" aria-label="Cargando Barba Roja">
      <div class="logo-wrap">
        <span class="pulse"></span><span class="pulse p2"></span><span class="ring"></span>
        <img src="/icons/logo.png" alt="Barba Roja" />
      </div>
      <h1>Barba Roja</h1>
      <div class="pole" aria-hidden="true"></div>
      <p>Afilando las navajas</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
