<!doctype html>
<html lang="es">
  <head>
    <script>
      /* Si abren ".../Barba-Roja" (sin barra final, p. ej. enlaces pegados en WhatsApp) las rutas relativas
         apuntarían a la raíz del dominio y todo fallaría. Se corrige antes de cargar nada. */
      (function () {
        var p = location.pathname;
        if (!/\/$/.test(p) && !/\.[a-z0-9]+$/i.test(p)) { location.replace(p + '/' + location.search + location.hash); return; }
        window.__brFails = [];
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && t !== window && (t.src || t.href)) window.__brFails.push((t.tagName || '?') + ' ' + (t.src || t.href));
        }, true);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Barba Roja · Barbería en Rohrmoser</title>
    <meta name="description" content="Barbería Barba Roja, Rohrmoser, San José. Reserva tu cita de barba y pelo en línea." />
    <meta name="theme-color" content="#E51E25" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Barba Roja" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* ---------- Pantalla de carga (CSS crítico, independiente de la app) ---------- */
      html, body { margin: 0; background: #0D0D0D; }
      #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0D0D0D; overflow: hidden; transition: opacity .7s cubic-bezier(.4,0,.2,1), visibility .7s; font-family: Inter, system-ui, sans-serif; }
      #splash.splash-hide { opacity: 0; visibility: hidden; }
      #splash .glow { position: absolute; width: 140vmax; height: 140vmax; left: 50%; top: 42%; transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(229,30,37,.28) 0%, rgba(229,30,37,.08) 28%, transparent 55%); animation: sp-breathe 3.2s ease-in-out infinite; }
      #splash .logo-wrap { position: relative; width: 168px; height: 168px; display: grid; place-items: center; animation: sp-in .9s cubic-bezier(.2,.9,.3,1) both; }
      #splash .logo-wrap img { width: 120px; height: 120px; border-radius: 50%; position: relative; z-index: 2; background: #E51E25;
        box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 18px 60px rgba(229,30,37,.55); animation: sp-float 3.4s ease-in-out infinite; }
      #splash .ring { position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid transparent;
        border-top-color: #E51E25; border-right-color: rgba(229,30,37,.35); animation: sp-spin 1.6s cubic-bezier(.55,.1,.35,.9) infinite; }
      #splash .ring.r2 { inset: 12px; border-top-color: rgba(255,255,255,.7); border-right-color: transparent; animation-duration: 2.4s; animation-direction: reverse; }
      #splash h1 { margin: 34px 0 0; font-family: 'Bebas Neue', Impact, sans-serif; font-weight: 400; font-size: 46px; line-height: 1; letter-spacing: .28em; padding-left: .28em;
        color: #fff; text-transform: uppercase; animation: sp-rise .9s .2s cubic-bezier(.2,.9,.3,1) both; }
      #splash .sub { margin: 10px 0 0; font-size: 11px; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; color: #E51E25; animation: sp-rise .9s .35s cubic-bezier(.2,.9,.3,1) both; }
      #splash .bar { margin-top: 38px; width: 160px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; animation: sp-rise .9s .5s both; }
      #splash .bar i { display: block; height: 100%; width: 45%; border-radius: 3px; background: linear-gradient(90deg, transparent, #E51E25, #fff 90%); animation: sp-bar 1.25s cubic-bezier(.65,0,.35,1) infinite; }
      #splash .err { display: none; margin-top: 26px; text-align: center; color: #d4d4d4; font-size: 14px; }
      #splash .err button { margin-top: 12px; padding: 10px 22px; border: 0; border-radius: 999px; background: #E51E25; color: #fff; font: 600 14px Inter, sans-serif; }
      #splash .err pre { margin: 18px 12px 0; max-width: 88vw; white-space: pre-wrap; word-break: break-all; text-align: left; font: 11px/1.4 ui-monospace, monospace; color: #737373; }
      #splash.splash-error .err { display: block; }
      #splash.splash-error .bar { display: none; }
      @keyframes sp-in { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
      @keyframes sp-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes sp-spin { to { transform: rotate(360deg); } }
      @keyframes sp-rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      @keyframes sp-bar { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
      @keyframes sp-breathe { 0%,100% { opacity: .75; transform: translate(-50%,-50%) scale(.96); } 50% { opacity: 1; transform: translate(-50%,-50%) scale(1.04); } }
      @media (prefers-reduced-motion: reduce) { #splash *, #splash { animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite" aria-label="Cargando Barba Roja">
      <div class="glow"></div>
      <div class="logo-wrap">
        <span class="ring"></span><span class="ring r2"></span>
        <img src="/icons/logo.png" alt="" width="120" height="120" />
      </div>
      <h1>Barba Roja</h1>
      <p class="sub">Rohrmoser · San José</p>
      <div class="bar" aria-hidden="true"><i></i></div>
      <div class="err">No se pudo cargar la página.<br /><button type="button" id="splash-retry">Limpiar y reintentar</button>
        <pre id="splash-diag"></pre></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      /* Quita la pantalla de carga cuando la app montó (mín. 1.4 s). Vive fuera del bundle para que NUNCA
         se quede atascada. Si algo falla: intenta repararse solo una vez (borra service worker y cachés)
         y, si sigue fallando, muestra qué archivo no cargó. */
      (function () {
        var s = document.getElementById('splash'); if (!s) return;
        var t0 = Date.now();
        function hide() { s.classList.add('splash-hide'); setTimeout(function () { s.remove(); }, 800); }
        function clean() {
          var jobs = [];
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
          return Promise.all(jobs).catch(function () {});
        }
        function fail() {
          var healed = false; try { healed = sessionStorage.getItem('br_healed'); } catch (e) {}
          if (!healed) { try { sessionStorage.setItem('br_healed', '1'); } catch (e) {} return clean().then(function () { location.reload(); }); }
          document.getElementById('splash-diag').textContent = 'Página: ' + location.href + '\n' + (window.__brFails.length ? 'No cargó:\n' + window.__brFails.join('\n') : 'La app no arrancó.');
          s.classList.add('splash-error');
        }
        document.getElementById('splash-retry').onclick = function () { try { sessionStorage.removeItem('br_healed'); } catch (e) {} clean().then(function () { location.reload(); }); };
        var iv = setInterval(function () {
          var el = Date.now() - t0, root = document.getElementById('root');
          var scriptFailed = window.__brFails.some(function (f) { return /^SCRIPT/.test(f); });
          if (root && root.childElementCount > 0 && el > 1400) {
            clearInterval(iv);
            try { sessionStorage.removeItem('br_healed'); } catch (e) {}
            var fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
            Promise.race([fonts, new Promise(function (r) { setTimeout(r, 1200); })]).then(hide);
          } else if ((scriptFailed && el > 1500) || el > 9000) { clearInterval(iv); fail(); }
        }, 100);
      })();
    </script>
  </body>
</html>
